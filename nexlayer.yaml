application:
  name: penpot
  pods:
  # ---------------------------------------------------------------------------
  # Frontend: official prebuilt nginx image. Web entry on 8080.
  # nginx proxies /api, /assets, /ws -> backend ; /api/export -> exporter.
  # Backend/exporter upstreams MUST be overridden to the Nexlayer service DNS,
  # otherwise nginx falls back to the baked defaults `penpot-backend` /
  # `penpot-exporter` which do not resolve in a Nexlayer namespace.
  # ---------------------------------------------------------------------------
  - name: frontend
    image: penpotapp/frontend:latest
    path: /
    servicePorts:
    - 8080
    vars:
      PENPOT_FLAGS: "enable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies"
      PENPOT_PUBLIC_URI: "https://relaxed-weasel-penpot.cloud.nexlayer.ai"
      PENPOT_BACKEND_URI: "http://penpot-backend-service:6060"
      PENPOT_EXPORTER_URI: "http://penpot-exporter-service:6061"
      PENPOT_NITRATE_URI: "http://penpot-backend-service:6060"
      PENPOT_DISABLE_IPV6_LISTEN: "true"

  # ---------------------------------------------------------------------------
  # Backend: official prebuilt Clojure image on 6060.
  # CRITICAL: PENPOT_DATABASE_URI must be host-only (postgresql://host:port/db).
  # Inline credentials (postgresql://user:pass@host/db) break Penpot's JDBC
  # driver resolution -> "No suitable driver". Credentials go in the separate
  # PENPOT_DATABASE_USERNAME / PENPOT_DATABASE_PASSWORD vars.
  # DNS uses the per-app service name (postgres.pod collides across apps in a
  # shared namespace).
  # ---------------------------------------------------------------------------
  - name: backend
    image: penpotapp/backend:latest
    path: /api
    servicePorts:
    - 6060
    vars:
      PENPOT_FLAGS: "enable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies"
      PENPOT_SECRET_KEY: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      PENPOT_DATABASE_URI: "postgresql://penpot-postgres-service:5432/penpot"
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: "XsQW5OM7X1Z5UHqLIce70oPBx7_vH9ki"
      PENPOT_REDIS_URI: "redis://penpot-redis-service:6379/0"
      PENPOT_PUBLIC_URI: "https://relaxed-weasel-penpot.cloud.nexlayer.ai"
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
    volumes:
    - name: penpot-assets
      mountPath: /opt/data/assets
      size: 10Gi

  # ---------------------------------------------------------------------------
  # Exporter: official prebuilt image on 6061. Renders PDFs/images; needs redis
  # and the shared secret key. Frontend proxies /api/export here.
  # ---------------------------------------------------------------------------
  - name: exporter
    image: penpotapp/exporter:latest
    servicePorts:
    - 6061
    vars:
      PENPOT_SECRET_KEY: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      PENPOT_REDIS_URI: "redis://penpot-redis-service:6379/0"
      PENPOT_PUBLIC_URI: "https://relaxed-weasel-penpot.cloud.nexlayer.ai"

  # ---------------------------------------------------------------------------
  # Postgres (dedicated pod, per-app service name).
  # ---------------------------------------------------------------------------
  - name: penpot-postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: "XsQW5OM7X1Z5UHqLIce70oPBx7_vH9ki"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - name: penpot-db
      mountPath: /var/lib/postgresql/data
      size: 5Gi

  # ---------------------------------------------------------------------------
  # Redis (dedicated pod, per-app service name).
  # ---------------------------------------------------------------------------
  - name: penpot-redis
    image: redis:7-alpine
    servicePorts:
    - 6379
    volumes:
    - name: penpot-redis
      mountPath: /data
      size: 2Gi
